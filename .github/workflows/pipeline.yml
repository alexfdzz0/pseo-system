name: PSEO Pipeline (Zero-Budget)

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas, 24/7, sin tocar nada
  workflow_dispatch: {}      # permite lanzarlo manualmente desde la UI de GitHub

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline de contenido
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python pipeline.py

      - name: Commit y push de artículos nuevos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(content): nuevos artículos auto-generados [skip ci]"
          file_pattern: "site/src/content/posts/*.md"
